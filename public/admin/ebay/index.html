<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel eBay — Geek By Carlos</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(180deg, #0a1024 0%, #0d1330 100%);
  color: #e2e8f0; min-height:100vh; padding:20px;
  display:flex; align-items:center; justify-content:center;
}
.wrap { max-width: 720px; width:100%; }
.header {
  background: linear-gradient(135deg, #e53238 0%, #0064d2 33%, #f5af02 66%, #86b817 100%);
  padding: 26px 30px; border-radius: 16px; margin-bottom: 26px;
  text-align:center;
}
.header h1 { color:white; font-size:26px; margin-bottom:6px; }
.header p { color:rgba(255,255,255,0.9); font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
@media (max-width:640px) { .grid { grid-template-columns:1fr; } }
.tile {
  background:#131c3a; border:1px solid #2a3a6e;
  border-radius:14px; padding:26px 22px; text-decoration:none; color:inherit;
  transition:transform 0.15s, border-color 0.15s;
  text-align:center; display:block;
}
.tile:hover { transform:translateY(-2px); border-color:#f5af02; }
.tile .icon { font-size:42px; margin-bottom:12px; }
.tile h2 { color:#f5af02; font-size:18px; margin-bottom:6px; }
.tile p { color:#94a3b8; font-size:13px; }
@media (max-width:640px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>📦 Panel eBay</h1>
    <p>Geek By Carlos — herramienta interna</p>
  </div>
  <div class="grid">
    <a class="tile" href="/admin/ebay/cargar.html">
      <div class="icon">➕</div>
      <h2>Cargar pedido</h2>
      <p>Ingresa un pedido nuevo desde el correo de eBay</p>
    </a>
    <a class="tile" href="/admin/ebay/ver.html">
      <div class="icon">📋</div>
      <h2>Ver pedidos</h2>
      <p>Lista de todo lo que se ha cargado</p>
    </a>
    <a class="tile" href="/admin/ebay/editar.html">
      <div class="icon">🔧</div>
      <h2>Editar pedido</h2>
      <p>Agregar tracking, imagen o notas a un pedido existente</p>
    </a>
  </div>
</div>
</body>
</html>
