<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar pedido — eBay</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(180deg,#0a1024 0%,#0d1330 100%); color:#e2e8f0;
  min-height:100vh; padding:20px; }
.wrap { max-width:820px; margin:0 auto; }
.header { background:linear-gradient(135deg,#e53238 0%,#0064d2 33%,#f5af02 66%,#86b817 100%);
  padding:20px 26px; border-radius:14px; margin-bottom:18px;
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.header h1 { color:white; font-size:20px; }
.header a { background:rgba(0,0,0,0.35); color:white; text-decoration:none;
  padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600; }
.card { background:#131c3a; border:1px solid #2a3a6e; border-radius:12px; padding:22px; margin-bottom:16px; }
h2 { font-size:13px; color:#f5af02; text-transform:uppercase; letter-spacing:1px;
  margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid #2a3a6e; }
.field { margin-bottom:14px; }
label { display:block; font-size:11px; color:#94a3b8; text-transform:uppercase;
  letter-spacing:0.5px; font-weight:600; margin-bottom:6px; }
input, select, textarea { width:100%; background:#0f1730; border:1px solid #2a3a6e;
  color:#e2e8f0; padding:10px 14px; border-radius:8px; font-size:14px; font-family:inherit; }
input:focus, textarea:focus, select:focus { outline:none; border-color:#f5af02;
  box-shadow:0 0 0 3px rgba(245,175,2,0.15); }
textarea { resize:vertical; min-height:70px; }
.row { display:grid; grid-template-columns:2fr 1fr; gap:12px; }
.actions { display:flex; gap:10px; justify-content:flex-end;
  padding-top:12px; border-top:1px solid #2a3a6e; margin-top:8px; }
.btn { padding:11px 22px; border:none; border-radius:8px; cursor:pointer;
  font-weight:700; font-size:14px; }
.btn-primary { background:linear-gradient(135deg,#00a86b,#0064d2); color:white; }
.btn-secondary { background:#2a3a6e; color:#e2e8f0; }
.msg { padding:12px 18px; border-radius:8px; margin-bottom:14px;
  font-size:14px; font-weight:600; }
.msg.ok { background:rgba(0,168,107,0.15); border:1px solid #00a86b; color:#4ade80; }
.msg.err { background:rgba(229,50,56,0.15); border:1px solid #e53238; color:#f87171; }
.hidden { display:none; }
.hint { font-size:11px; color:#64748b; margin-top:4px; }
.pill { display:inline-block; padding:2px 10px; border-radius:10px;
  font-size:10px; font-weight:700; text-transform:uppercase; margin-left:8px; }
.pill.usa { background:rgba(59,130,246,0.2); color:#93c5fd; }
.preview { margin-top:8px; }
.preview img { max-width:200px; max-height:200px; border:1px solid #2a3a6e; border-radius:8px; padding:4px; background:white; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🔧 Editar pedido</h1>
    <a href="/admin/ebay/ver.html">← Ver todos</a>
  </div>

  <div id="msg" class="msg hidden"></div>

  <div class="card">
    <h2>1. Buscar pedido</h2>
    <div class="field">
      <label>Selecciona un pedido</label>
      <select id="sel"></select>
      <div class="hint">Busca por Order ID o título. Los más recientes van arriba.</div>
    </div>
  </div>

  <div id="editor" class="hidden">
    <div class="card">
      <h2>2. Datos actuales</h2>
      <div id="datos"></div>
    </div>

    <div class="card">
      <h2>3. Campos a actualizar</h2>
      <div class="row">
        <div class="field">
          <label>Tracking number</label>
          <input type="text" id="tracking" placeholder="Ej: ESUS358838844">
        </div>
        <div class="field">
          <label>Carrier</label>
          <select id="carrier">
            <option value="">— Elegir —</option>
            <option value="eBay Standard Delivery">eBay Standard Delivery</option>
            <option value="USPS">USPS</option>
            <option value="FedEx">FedEx</option>
            <option value="UPS">UPS</option>
            <option value="DHL">DHL</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>URL de la imagen del producto</label>
        <input type="url" id="imagen" placeholder="https://i.ebayimg.com/...">
        <div class="hint">Clic derecho sobre la foto en eBay → "Copy image address"</div>
        <div class="preview" id="preview"></div>
      </div>
      <div class="field">
        <label>URL del listing en eBay</label>
        <input type="url" id="item_url" placeholder="https://www.ebay.com/itm/...">
      </div>
      <div class="field">
        <label>Notas internas</label>
        <textarea id="notas" placeholder="Cualquier observación"></textarea>
      </div>
      <div class="actions">
        <button class="btn btn-secondary" onclick="cargarActual()">Descartar cambios</button>
        <button class="btn btn-primary" onclick="guardar()">💾 Guardar</button>
      </div>
    </div>
  </div>
</div>

<script>
let TODOS = [];
let actual = null;

const $ = id => document.getElementById(id);
function showMsg(t, ok) {
  const m = $('msg'); m.textContent = t;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  window.scrollTo({top:0, behavior:'smooth'});
  if (ok) setTimeout(() => m.classList.add('hidden'), 4000);
}

async function inicial() {
  const r = await fetch('/api/ebay/pedidos');
  const j = await r.json();
  TODOS = j.pedidos || [];
  const sel = $('sel');
  sel.innerHTML = '<option value="">— Elegir pedido —</option>' + TODOS.map(p => {
    const item = (p.items && p.items[0]) || {};
    const fecha = p.fecha_compra ? new Date(p.fecha_compra).toLocaleDateString('es-CO',{year:'2-digit',month:'short',day:'2-digit'}) : '—';
    return `<option value="${p.order_id}">${p.order_id} · ${fecha} · ${(item.titulo||'').substring(0,60)}</option>`;
  }).join('');
  sel.addEventListener('change', () => {
    const p = TODOS.find(x => x.order_id === sel.value);
    if (p) mostrar(p); else $('editor').classList.add('hidden');
  });
}

function mostrar(p) {
  actual = p;
  const item = (p.items && p.items[0]) || {};
  const tracking = (p.trackings && p.trackings[0]) || {};
  const fecha = p.fecha_compra ? new Date(p.fecha_compra).toLocaleString('es-CO') : '—';
  $('datos').innerHTML = `
    <div style="font-size:13px; line-height:1.7;">
      <div><b>Order ID:</b> <code style="color:#f5af02">${p.order_id}</code></div>
      <div><b>Título:</b> ${item.titulo || '—'}</div>
      <div><b>Vendedor:</b> ${p.vendedor || item.vendedor || '—'}</div>
      <div><b>Fecha:</b> ${fecha}</div>
      <div><b>Total:</b> $${Number(p.total||0).toFixed(2)}</div>
      <div><b>Estado:</b> ${p.estado_personal || 'sin estado'}</div>
      <div><b>Tracking:</b> ${tracking.numero ? tracking.numero + ' · ' + (tracking.carrier||'') : '<i style="color:#f87171">sin tracking</i>'}</div>
      <div><b>Imagen:</b> ${item.imagen ? `<a href="${item.imagen}" target="_blank" style="color:#f5af02">${item.imagen.substring(0,60)}...</a>` : '<i style="color:#f87171">sin imagen</i>'}</div>
    </div>`;
  // Rellenar campos
  $('tracking').value = tracking.numero || '';
  $('carrier').value = tracking.carrier || '';
  $('imagen').value = item.imagen || '';
  $('item_url').value = item.url || '';
  $('notas').value = p.notas || '';
  $('preview').innerHTML = item.imagen ? `<img src="${item.imagen}" alt="preview">` : '';
  $('editor').classList.remove('hidden');
}

function cargarActual() {
  if (actual) mostrar(actual);
}

$('imagen').addEventListener('input', e => {
  const url = e.target.value;
  $('preview').innerHTML = url ? `<img src="${url}" alt="preview" onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'URL inválida',style:'color:#f87171;font-size:12px'}))">` : '';
});

async function guardar() {
  if (!actual) return;
  const data = {
    order_id: actual.order_id,
    tracking: $('tracking').value.trim(),
    carrier: $('carrier').value.trim(),
    imagen: $('imagen').value.trim(),
    item_url: $('item_url').value.trim(),
    notas: $('notas').value,
  };
  try {
    const r = await fetch('/api/ebay/pedidos/edit', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    const j = await r.json();
    if (j.ok) {
      showMsg(`✅ ${data.order_id} actualizado`, true);
      // Refrescar el objeto en memoria
      await inicial();
      $('sel').value = data.order_id;
      const p = TODOS.find(x => x.order_id === data.order_id);
      if (p) mostrar(p);
    } else {
      showMsg('❌ ' + (j.error || 'Error'), false);
    }
  } catch (e) { showMsg('❌ ' + e.message, false); }
}

inicial();
</script>
</body>
</html>
