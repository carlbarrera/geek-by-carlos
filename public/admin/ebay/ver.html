<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos eBay — Geek By Carlos</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(180deg, #0a1024 0%, #0d1330 100%);
  color: #e2e8f0; min-height:100vh; padding:20px;
}
.container { max-width: 1400px; margin: 0 auto; }
.header {
  background: linear-gradient(135deg, #e53238 0%, #0064d2 33%, #f5af02 66%, #86b817 100%);
  padding: 18px 24px; border-radius: 14px; margin-bottom: 18px;
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
}
.header h1 { color:white; font-size:20px; }
.header a {
  background:rgba(0,0,0,0.35); color:white; text-decoration:none;
  padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600;
}
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:16px; }
.stat { background:#131c3a; border:1px solid #2a3a6e; border-radius:10px; padding:12px 16px; text-align:center; }
.stat .n { font-size:22px; font-weight:800; color:#f5af02; }
.stat .l { font-size:10px; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
.stat.usd .n { color:#4ade80; }
.filters {
  background:#131c3a; border:1px solid #2a3a6e; border-radius:10px;
  padding:12px; margin-bottom:14px;
  display:flex; gap:8px; flex-wrap:wrap; align-items:center;
}
.chip {
  padding:6px 14px; border-radius:16px; border:1px solid #2a3a6e;
  background:#0f1730; color:#94a3b8; cursor:pointer; font-size:12px; font-weight:600;
  transition:all 0.15s;
}
.chip:hover { border-color:#f5af02; color:#e2e8f0; }
.chip.on { background:#f5af02; color:#0a1024; border-color:#f5af02; }
.chip .count { opacity:0.65; margin-left:4px; }
input.search {
  flex:1; min-width:200px; background:#0f1730; border:1px solid #2a3a6e;
  color:#e2e8f0; padding:8px 12px; border-radius:8px; font-size:13px;
}

table { width:100%; border-collapse:separate; border-spacing:0; background:#131c3a; border-radius:12px; overflow:hidden; }
thead { background:#1a2548; position:sticky; top:0; }
th { padding:10px 12px; text-align:left; font-size:10px; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }
th.right, td.right { text-align:right; }
td { padding:10px 12px; font-size:12px; border-top:1px solid #2a3a6e; vertical-align:top; }
tr:hover td { background:#1a2548; }

.oid { font-family:monospace; color:#f5af02; font-size:11px; font-weight:600; }
.fecha { color:#94a3b8; font-size:10px; margin-top:2px; }
.titulo { color:#e2e8f0; font-weight:600; font-size:12px; line-height:1.3; max-width:420px; }
.meta { color:#94a3b8; font-size:10px; margin-top:2px; }
.tracking { color:#4ade80; font-family:monospace; font-size:11px; margin-top:2px; }

.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.b-none { background:rgba(148,163,184,0.2); color:#cbd5e1; }
.b-usa { background:rgba(59,130,246,0.2); color:#93c5fd; }
.b-camino { background:rgba(245,175,2,0.2); color:#fcd34d; }
.b-recibido { background:rgba(74,222,128,0.2); color:#86efac; }
.b-archivado { background:rgba(100,116,139,0.2); color:#94a3b8; }

.est-select { background:#0f1730; border:1px solid #2a3a6e; color:#e2e8f0; padding:4px 8px; border-radius:6px; font-size:11px; }

.actions { display:flex; gap:6px; }
.btn-sm { background:#0f1730; color:#94a3b8; border:1px solid #2a3a6e; border-radius:6px; padding:4px 8px; font-size:10px; cursor:pointer; font-weight:600; }
.btn-sm:hover { color:#e2e8f0; border-color:#f5af02; }
.btn-sm.del { color:#f87171; border-color:#7f1d1d; }
.btn-sm.del:hover { background:#7f1d1d; color:white; }

.empty { padding:60px 30px; text-align:center; background:#131c3a; border-radius:12px; color:#64748b; font-size:15px; }
.loading { padding:40px; text-align:center; color:#94a3b8; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 Pedidos eBay</h1>
    <a href="/admin/ebay/cargar.html">➕ Cargar nuevo pedido</a>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="s-mostrados">0</div><div class="l">Mostrados</div></div>
    <div class="stat"><div class="n" id="s-total">0</div><div class="l">Total registrados</div></div>
    <div class="stat"><div class="n" id="s-pend">0</div><div class="l">Pendientes</div></div>
    <div class="stat usd"><div class="n" id="s-usd">$0</div><div class="l">USD invertidos</div></div>
  </div>

  <div class="filters">
    <button class="chip on" data-est="pendientes">Pendientes<span class="count" id="c-pendientes">0</span></button>
    <button class="chip" data-est="en-usa">En USA<span class="count" id="c-en-usa">0</span></button>
    <button class="chip" data-est="">Sin estado<span class="count" id="c-sin"></span></button>
    <button class="chip" data-est="recibido">Recibidos<span class="count" id="c-recibido">0</span></button>
    <button class="chip" data-est="archivado">Archivados<span class="count" id="c-archivado">0</span></button>
    <button class="chip" data-est="todos">Todos<span class="count" id="c-todos">0</span></button>
    <input type="text" class="search" id="q" placeholder="🔍 Buscar (order id, título, tracking)...">
  </div>

  <div id="content" class="loading">Cargando…</div>
</div>

<script>
let TODOS = [];
let filtro = 'pendientes';
let query = '';

const fmt = n => '$' + Number(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtInt = n => Number(n||0).toLocaleString('en-US');

const ESTADOS = [
  {v:'', label:'Sin estado', clase:'b-none'},
  {v:'en-usa', label:'En USA', clase:'b-usa'},
  {v:'en-camino', label:'En camino', clase:'b-camino'},
  {v:'recibido', label:'Recibido', clase:'b-recibido'},
  {v:'archivado', label:'Archivado', clase:'b-archivado'},
];
function badge(estado) {
  const e = ESTADOS.find(x => x.v === (estado||'')) || ESTADOS[0];
  return `<span class="badge ${e.clase}">${e.label}</span>`;
}
function estadoSelect(orderId, actual) {
  const opts = ESTADOS.map(e =>
    `<option value="${e.v}" ${e.v===(actual||'')?'selected':''}>${e.label}</option>`
  ).join('');
  return `<select class="est-select" onchange="cambiarEstado('${orderId}', this.value)">${opts}</select>`;
}

async function cargar() {
  try {
    const r = await fetch('/api/ebay/pedidos');
    const j = await r.json();
    TODOS = j.pedidos || [];
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty">Error cargando pedidos: ' + e.message + '</div>';
  }
}

function esPendiente(p) {
  const e = p.estado_personal || '';
  return e !== 'recibido' && e !== 'archivado';
}

function filtrar() {
  let list = TODOS;
  if (filtro === 'pendientes') list = list.filter(esPendiente);
  else if (filtro === 'todos') { /* nada */ }
  else list = list.filter(p => (p.estado_personal || '') === filtro);

  if (query) {
    const q = query.toLowerCase();
    list = list.filter(p => {
      const item = (p.items && p.items[0]) || {};
      const t = (p.trackings && p.trackings[0]) || {};
      return (p.order_id || '').toLowerCase().includes(q) ||
             (item.titulo || '').toLowerCase().includes(q) ||
             (t.numero || '').toLowerCase().includes(q) ||
             (p.vendedor || '').toLowerCase().includes(q);
    });
  }
  return list;
}

function render() {
  // Stats
  document.getElementById('s-total').textContent = TODOS.length;
  document.getElementById('s-pend').textContent = TODOS.filter(esPendiente).length;
  const usdTotal = TODOS.reduce((s,p) => s + Number(p.total||0), 0);
  document.getElementById('s-usd').textContent = fmt(usdTotal);

  // Contadores de chips
  document.getElementById('c-pendientes').textContent = TODOS.filter(esPendiente).length;
  document.getElementById('c-en-usa').textContent = TODOS.filter(p => p.estado_personal === 'en-usa').length;
  document.getElementById('c-sin').textContent = TODOS.filter(p => !p.estado_personal).length;
  document.getElementById('c-recibido').textContent = TODOS.filter(p => p.estado_personal === 'recibido').length;
  document.getElementById('c-archivado').textContent = TODOS.filter(p => p.estado_personal === 'archivado').length;
  document.getElementById('c-todos').textContent = TODOS.length;

  const list = filtrar();
  document.getElementById('s-mostrados').textContent = list.length;

  if (!list.length) {
    document.getElementById('content').innerHTML =
      '<div class="empty">Sin resultados para este filtro.</div>';
    return;
  }

  const rows = list.map(p => {
    const item = (p.items && p.items[0]) || {};
    const tracking = (p.trackings && p.trackings[0]) || {};
    const fecha = p.fecha_compra ? new Date(p.fecha_compra).toLocaleDateString('es-CO', {year:'2-digit', month:'short', day:'2-digit'}) : '—';
    const oidSafe = p.order_id.replace(/'/g,"\\'");
    return `
      <tr>
        <td>
          <div class="oid">${p.order_id}</div>
          <div class="fecha">${fecha}</div>
        </td>
        <td>
          <div class="titulo">${(item.titulo || '').substring(0,110)}</div>
          <div class="meta">Vendedor: ${p.vendedor || item.vendedor || '—'} · ${p.num_items || 1} und</div>
          ${tracking.numero ? `<div class="tracking">📮 ${tracking.numero} · ${tracking.carrier || '—'}</div>` : '<div class="meta" style="color:#f87171;">⚠️ sin tracking</div>'}
        </td>
        <td>${badge(p.estado_personal)}</td>
        <td>${estadoSelect(p.order_id, p.estado_personal)}</td>
        <td class="right"><b>${fmt(p.total)}</b></td>
        <td class="right"><button class="btn-sm del" onclick="borrar('${oidSafe}')">Borrar</button></td>
      </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <table>
      <thead><tr>
        <th>Order ID / Fecha</th>
        <th>Producto</th>
        <th>Estado</th>
        <th>Cambiar</th>
        <th class="right">Total</th>
        <th class="right"></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function cambiarEstado(order_id, estado) {
  try {
    const r = await fetch('/api/ebay/pedidos/estado', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ order_id, estado_personal: estado })
    });
    const j = await r.json();
    if (j.ok) {
      // Actualizar en memoria y re-render
      const p = TODOS.find(x => x.order_id === order_id);
      if (p) p.estado_personal = estado;
      render();
    } else {
      alert('Error: ' + (j.error || 'no se pudo cambiar'));
    }
  } catch (e) {
    alert('Error de red: ' + e.message);
  }
}

async function borrar(order_id) {
  if (!confirm('¿Borrar el pedido ' + order_id + '?')) return;
  const r = await fetch('/api/ebay/pedidos?order_id=' + encodeURIComponent(order_id), { method: 'DELETE' });
  const j = await r.json();
  if (j.ok) {
    TODOS = TODOS.filter(x => x.order_id !== order_id);
    render();
  } else {
    alert('Error: ' + (j.error || 'no se pudo borrar'));
  }
}

document.querySelectorAll('.chip[data-est]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.chip[data-est]').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  filtro = b.dataset.est;
  render();
}));
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });

cargar();
</script>
</body>
</html>
