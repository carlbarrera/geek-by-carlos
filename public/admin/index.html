<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración — Geek By Carlos</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0a0f1e; color:#e0e0e0;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.wrap { max-width:720px; width:100%; text-align:center; }
.wrap > img { width:80px; height:80px; border-radius:50%; object-fit:cover; margin-bottom:12px; }
h1 { color:#fff; font-size:24px; margin-bottom:4px; }
p.sub { color:#9ca3af; font-size:13px; margin-bottom:26px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
a.tile { display:block; background:#12182c; border:2px solid #1e3a5f; border-radius:14px; padding:26px 20px;
  text-decoration:none; color:inherit; transition:transform .15s, border-color .15s; }
a.tile:hover { transform:translateY(-2px); border-color:#4ade80; }
.tile .icon { font-size:40px; margin-bottom:10px; }
.tile h2 { color:#4ade80; font-size:18px; margin-bottom:6px; }
.tile span { color:#9ca3af; font-size:13px; }
@media (max-width:600px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <img src="/logo.jpeg" alt="Geek By Carlos">
  <h1>Geek By Carlos</h1>
  <p class="sub">Administración interna</p>
  <div class="grid">
    <a class="tile" href="/admin/catalogo/">
      <div class="icon">🃏</div>
      <h2>Catálogo de cartas</h2>
      <span>Stock, precios, ventas e historial</span>
    </a>
    <a class="tile" href="/admin/ebay/">
      <div class="icon">📦</div>
      <h2>Pedidos eBay</h2>
      <span>Seguimiento de compras y envíos</span>
    </a>
  </div>
</div>
</body>
</html>
